name: Phase 01 Product Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  foundation:
    name: Typecheck, foundation tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify foundation contracts
        run: npm run test:foundation

      - name: Build production bundle
        run: npm run build

