name: SQUAD OS Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # The repository currently has no committed package-lock.json.
      # Generate a run-local lockfile, then install strictly from that lockfile.
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Export resolved lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify typecheck, foundation contracts, character data and production bundle
        run: npm run build
