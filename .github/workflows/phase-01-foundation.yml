name: Phase 01 Product Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Typecheck, foundation tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify foundation contracts
        run: npm run test:foundation

      - name: Build production bundle
        run: npm run build
