name: SQUAD OS — Evolution Phase Two.1–2.12 + Phase Three.1–3.15 Final Acceptance

on:
  push:
    branches: [main, feat/evolution-phase-three-1-existing-evaluation-audit, feat/evolution-phase-one-identity-timezone, feat/evolution-phase-two-session-foundation, feat/evolution-phase-two-2-canonical-session-identity, feat/evolution-phase-two-3-match-identity, feat/evolution-phase-two-4-session-lifecycle, feat/evolution-phase-two-5-session-roster-snapshot, feat/evolution-phase-two-6-role-snapshot, feat/evolution-phase-two-7-substitution-tracking, feat/evolution-phase-two-8-result-verification, feat/evolution-phase-two-9-module-integration, feat/evolution-phase-two-10-database-integrity, feat/evolution-phase-two-11-session-ui, feat/evolution-phase-two-12-final-acceptance, release/evolution-phase-three-only]
  pull_request:
    branches: [main, chore/evolution-phase-zero-one-naming, feat/evolution-phase-one-identity-timezone, feat/evolution-phase-two-session-foundation, feat/evolution-phase-two-2-canonical-session-identity, feat/evolution-phase-two-3-match-identity, feat/evolution-phase-two-4-session-lifecycle, feat/evolution-phase-two-5-session-roster-snapshot, feat/evolution-phase-two-6-role-snapshot, feat/evolution-phase-two-7-substitution-tracking, feat/evolution-phase-two-8-result-verification, feat/evolution-phase-two-9-module-integration, feat/evolution-phase-two-10-database-integrity, feat/evolution-phase-two-11-session-ui]

permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-replay:
    name: Production-baseline ordered pending migration replay (free GitHub runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Verify supported CLI dump and migration-list commands
        run: |
          supabase db dump --help >/dev/null
          supabase migration list --help >/dev/null
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated local Supabase test project
        run: |
          mkdir -p "$RUNNER_TEMP/squad-os-migration-replay"
          cd "$RUNNER_TEMP/squad-os-migration-replay"
          supabase init
      - name: Start disposable local Supabase stack
        run: supabase start -x studio,inbucket,imgproxy,logflare,vector
        working-directory: ${{ runner.temp }}/squad-os-migration-replay
      - name: Capture production schema-only baseline and applied migration ledger (read-only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Add the protected GitHub Actions secret SUPABASE_DB_URL (session-pooler or direct Postgres connection string); never commit or print it.}"
          SUPABASE_DB_URL="$SUPABASE_DB_URL" bash scripts/capture-supabase-schema-baseline.sh "$RUNNER_TEMP/squad-os-migration-replay/current-remote-public-schema.sql"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" > "$RUNNER_TEMP/squad-os-migration-replay/remote-versions.txt"
      - name: Restore schema-only baseline into disposable local Supabase
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/squad-os-migration-replay/current-remote-public-schema.sql"
        working-directory: ${{ github.workspace }}
      - name: Apply exactly the pending migrations in timestamp order
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/supabase/migrations"
          LOCAL_VERSIONS="$RUNNER_TEMP/squad-os-migration-replay/local-versions.txt"
          PENDING_VERSIONS="$RUNNER_TEMP/squad-os-migration-replay/pending-versions.txt"
          find "$ROOT" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort > "$LOCAL_VERSIONS"
          comm -23 "$LOCAL_VERSIONS" "$RUNNER_TEMP/squad-os-migration-replay/remote-versions.txt" > "$PENDING_VERSIONS"
          comm -13 "$LOCAL_VERSIONS" "$RUNNER_TEMP/squad-os-migration-replay/remote-versions.txt" > "$RUNNER_TEMP/squad-os-migration-replay/remote-only-versions.txt"
          test ! -s "$RUNNER_TEMP/squad-os-migration-replay/remote-only-versions.txt" || { echo 'Remote migration ledger contains versions absent from this repository.' >&2; cat "$RUNNER_TEMP/squad-os-migration-replay/remote-only-versions.txt"; exit 1; }
          cat > "$RUNNER_TEMP/squad-os-migration-replay/expected-pending-versions.txt" <<'VERSIONS'
          20261118060000
          20261119120000
          20261119140000
          20261119160000
          20261119180000
          20261119200000
          20261120200000
          20261120220000
          20261120230000
          20261121000000
          20261122130000
          20261122140000
          20261122150000
          20261122160000
          20261122170000
          20261122180000
          20261122190000
          20261122200000
          20261122210000
          20261122220000
          VERSIONS
          diff -u "$RUNNER_TEMP/squad-os-migration-replay/expected-pending-versions.txt" "$PENDING_VERSIONS"
          while IFS= read -r version; do
            file="$(find "$ROOT" -maxdepth 1 -type f -name "${version}_*.sql" -print -quit)"
            test -n "$file" || { echo "Missing migration file for $version" >&2; exit 1; }
            echo "Applying pending migration $version"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f "$file"
          done < "$PENDING_VERSIONS"
          echo "Successfully applied $(wc -l < "$PENDING_VERSIONS" | tr -d ' ') pending migrations to the disposable database."
      - name: Assert Evolution Phase Two and Three schema after ordered replay
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $replay$
          BEGIN
            IF to_regclass('public.canonical_sessions') IS NULL THEN RAISE EXCEPTION 'Phase 2 canonical_sessions missing after replay'; END IF;
            IF to_regclass('public.canonical_session_matches') IS NULL THEN RAISE EXCEPTION 'Phase 2 canonical_session_matches missing after replay'; END IF;
            IF to_regclass('public.evolution_dimension_registry') IS NULL THEN RAISE EXCEPTION 'Phase 3 dimension registry missing after replay'; END IF;
            IF to_regclass('public.evolution_evaluation_contexts') IS NULL THEN RAISE EXCEPTION 'Phase 3 evaluation contexts missing after replay'; END IF;
            IF to_regclass('public.evolution_evidence_items') IS NULL THEN RAISE EXCEPTION 'Phase 3 evidence model missing after replay'; END IF;
            IF to_regclass('public.evolution_player_score_snapshots') IS NULL THEN RAISE EXCEPTION 'Phase 3 score snapshots missing after replay'; END IF;
            IF to_regprocedure('public.create_evolution_evaluation_context(uuid,uuid,uuid,uuid,uuid,uuid)') IS NULL THEN RAISE EXCEPTION 'Phase 3 atomic context RPC missing after replay'; END IF;
            IF to_regprocedure('public.calculate_evolution_player_score_snapshot(uuid,text)') IS NULL THEN RAISE EXCEPTION 'Phase 3 scoring RPC missing after replay'; END IF;
          END $replay$;
          SQL
        working-directory: ${{ github.workspace }}
      - name: Stop disposable local Supabase stack
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/squad-os-migration-replay" ]; then
            cd "$RUNNER_TEMP/squad-os-migration-replay"
            supabase stop --no-backup || true
          else
            echo "Disposable Supabase project was not created; nothing to stop."
          fi
  foundation:
    needs: migration-replay
    name: Typecheck, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/squad_os_ci
      EVOLUTION_PHASE_THREE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Install Chromium for responsive UI acceptance
        run: npx playwright install --with-deps chromium
      - name: Export resolved lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install and start disposable local PostgreSQL (free GitHub runner)
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_ci

      - name: Verify Evolution Phase Three.2 canonical dimension registry against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_2_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_2_ci bash scripts/verify-evolution-phase-three-2-db.sh
      - name: Verify Evolution Phase Three.3 evidence model against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_3_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_3_ci bash scripts/verify-evolution-phase-three-3-db.sh
      - name: Verify Evolution Phase 2.2 canonical session migration against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_2_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_2_ci bash scripts/verify-evolution-phase-two-2-db.sh
      - name: Verify Evolution Phase Three.4 provenance and verification workflow against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_4_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_4_ci bash scripts/verify-evolution-phase-three-4-db.sh
      - name: Verify Evolution Phase Three.5 versioned rubric engine against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_5_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_5_ci bash scripts/verify-evolution-phase-three-5-db.sh
      - name: Verify Evolution Phase Three.6 role-based weight configuration against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_6_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_6_ci bash scripts/verify-evolution-phase-three-6-db.sh
      - name: Verify Evolution Phase Two.3 match identity migration against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_3_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_3_ci bash scripts/verify-evolution-phase-two-3-db.sh
      - name: Verify Evolution Phase Two.4 session lifecycle migration against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_4_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_4_ci bash scripts/verify-evolution-phase-two-4-db.sh
      - name: Verify Evolution Phase Two.5 session roster snapshot against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_5_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_5_ci bash scripts/verify-evolution-phase-two-5-db.sh
      - name: Verify Evolution Phase Two.6 role snapshot against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_6_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_6_ci bash scripts/verify-evolution-phase-two-6-db.sh
      - name: Verify Evolution Phase Two.7 substitution tracking against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_7_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_7_ci bash scripts/verify-evolution-phase-two-7-db.sh
      - name: Verify Evolution Phase Two.8 result verification against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_8_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_8_ci bash scripts/verify-evolution-phase-two-8-db.sh
      - name: Verify Evolution Phase Two.9 module integration against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_9_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_9_ci bash scripts/verify-evolution-phase-two-9-db.sh
      - name: Verify Evolution Phase Two.10 database integrity against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_two_10_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_two_10_ci bash scripts/verify-evolution-phase-two-10-db.sh
      - name: Verify staged B migration against disposable PostgreSQL
        run: bash scripts/verify-evolution-phase-one-5-b-db.sh
      - name: Verify staged security trigger ACL hardening
        run: bash scripts/verify-evolution-security-trigger-acls.sh
      - name: Verify responsive UI, touch targets, permissions and offline write guard
        run: npm run test:evolution-phase-two-11-visual
      - name: Upload responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-phase-two-11-responsive-screenshots
          path: test-results/phase-two-11/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Evolution Phase Three.7 Not Observed and missing-data rules against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_7_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_7_ci bash scripts/verify-evolution-phase-three-7-db.sh
      - name: Verify Evolution Phase Three.8 evidence coverage calculator against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_8_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_8_ci bash scripts/verify-evolution-phase-three-8-db.sh
      - name: Verify Evolution Phase Three.10 score snapshot history against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_10_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_10_ci bash scripts/verify-evolution-phase-three-10-db.sh
      - name: Verify Evolution Phase Three.11 atomic scoring and database integrity against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_11_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_11_ci bash scripts/verify-evolution-phase-three-11-db.sh
      - name: Verify Evolution Phase Three.12 security, RLS and permissions against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_12_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_12_ci bash scripts/verify-evolution-phase-three-12-db.sh
      - name: Verify Evolution Phase Three.13 atomic context creation against isolated disposable PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres squad_os_phase_three_13_ci
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/squad_os_phase_three_13_ci bash scripts/verify-evolution-phase-three-13-db.sh
      - name: Verify Evolution Phase Three.13 scoring UI and evaluation workflow contracts
        run: npm run test:evolution-phase-three-13
      - name: Verify Evolution Phase Three.14 existing module integration contracts
        run: node --test scripts/verify-evolution-phase-three-14.mjs
      - name: Verify Evolution Phase Three.14 responsive browser acceptance
        run: npm run test:evolution-phase-three-14-visual
      - name: Upload Evolution Phase Three.14 browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: evolution-phase-three-14-responsive-screenshots
          path: test-results/phase-three-14/
          if-no-files-found: error
          retention-days: 7

      - name: Verify Evolution Phase Three.15 final acceptance on the exact PR or push head
        env:
          EVOLUTION_PHASE_THREE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:evolution-phase-three-15

      - name: Verify typecheck, foundation contracts, character data, Evolution Phase Two.1–2.12 and Phase Three.1–3.15 audits and production bundle
        env:
          EVOLUTION_PHASE_THREE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
