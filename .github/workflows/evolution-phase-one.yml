name: SQUAD OS — Evolution Phase One CI

on:
  push:
    branches: [main, feat/evolution-phase-one-identity-timezone, fix/evolution-phase-one-audit-20261122]
  pull_request:
    branches: [main, chore/evolution-phase-zero-one-naming]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: squad_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squad_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/squad_os_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # The repository currently has no committed package-lock.json.
      # Generate a run-local lockfile, then install strictly from that lockfile.
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Export resolved lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify staged B migration against disposable PostgreSQL
        run: bash scripts/verify-evolution-phase-one-5-b-db.sh

      - name: Verify staged security trigger ACL hardening
        run: bash scripts/verify-evolution-security-trigger-acls.sh

      - name: Verify typecheck, foundation contracts, character data and production bundle
        run: npm run build
